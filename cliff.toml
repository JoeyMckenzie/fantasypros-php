[changelog]
header = """
# Changelog

Every notable change, taken from the commit log. Managed by `release.sh`.
"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
            {% if commit.breaking %}[**breaking**] {% endif %}\
            {{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}\n
"""
trim = true
render_always = false

[git]
conventional_commits = true
filter_unconventional = true
require_conventional = false
split_commits = false
protect_breaking_commits = false
filter_commits = false
fail_on_unmatched_commit = false
topo_order = false
sort_commits = "oldest"
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->🚀 Features" },
  { message = "^fix", group = "<!-- 1 -->🐛 Bug Fixes" },
  { message = "^perf", group = "<!-- 2 -->⚡ Performance" },
  { message = "^refactor", group = "<!-- 3 -->🚜 Refactor" },
  { message = "^doc", group = "<!-- 4 -->📚 Documentation" },
  { message = "^test", group = "<!-- 5 -->🧪 Testing" },
  # Dependabot opens these in bulk. They're noise in a library changelog.
  { message = "^chore\\(deps.*\\)", skip = true },
  { message = "^chore\\(release\\)", skip = true },
  # `deps:` is this repo's own type for moving a dependency floor, as opposed to
  # Dependabot's `chore(deps):`. Those are worth listing.
  { message = "^deps", group = "<!-- 6 -->📦 Dependencies" },
  { message = "^style", group = "<!-- 7 -->🎨 Styling" },
  { message = "^chore|^ci|^build", group = "<!-- 8 -->⚙️ Miscellaneous Tasks" },
  { message = "^revert", group = "<!-- 9 -->◀️ Revert" },
  { message = ".*", group = "<!-- 10 -->💼 Other" },
]

[bump]
# Both false so that below 1.0.0 a feature rides a patch and a breaking change
# rides a minor, and from 1.0.0 on normal semver applies. Verified across both
# ranges rather than taken from the docs, whose wording suggests otherwise:
#
#   0.1.0 + feat   -> 0.1.1      1.0.0 + feat   -> 1.1.0
#   0.1.0 + feat!  -> 0.2.0      1.0.0 + feat!  -> 2.0.0
#   0.1.0 + fix    -> 0.1.1      1.0.0 + fix    -> 1.0.1
#
# The one that matters is `feat!` on 0.x staying inside 0.x. Left at the default
# it jumps to 1.0.0, which declares the API stable by accident.
features_always_bump_minor = false
breaking_always_bump_major = false
