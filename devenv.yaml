# yaml-language-server: $schema=https://devenv.sh/devenv.schema.json
inputs:
  git-hooks:
    url: github:cachix/git-hooks.nix
    inputs:
      nixpkgs:
        follows: nixpkgs
  nixpkgs:
    url: github:cachix/devenv-nixpkgs/rolling
  # nixpkgs and git-hooks stay declared here: devenv does not resolve a
  # module's inputs transitively.
  fantasyphp:
    url: github:FantasyPHP/devenv
imports:
  - fantasyphp
